<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursed Checkers</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Butcherman&display=swap');

    :root {
      --blood: #8b0000;
      --void: #0a0a0a;
      --bone: #d4d4d4;
      --shadow: #1a0000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, var(--shadow) 0%, var(--void) 100%);
      color: var(--bone);
      font-family: 'Butcherman', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 0.5rem;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.05"/></svg>');
      pointer-events: none;
      z-index: 1;
    }

.intro {
      position: fixed;
      inset: 0;
      background: var(--void);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

.intro.hide {
      animation: fadeOut 0.5s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

.intro h1 {
      font-family: 'Creepster', cursive;
      font-size: clamp(2.5rem, 8vw, 5rem);
      color: var(--blood);
      text-shadow: 0 0 20px var(--blood), 0 0 40px #ff0000;
      animation: flicker 2s infinite alternate;
      margin-bottom: 1rem;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      42% { opacity: 0.8; }
      43% { opacity: 0; }
      44% { opacity: 0.8; }
    }

.intro p {
      font-size: 1rem;
      color: #ff4444;
      margin-bottom: 2rem;
      max-width: 400px;
      text-shadow: 0 0 10px #ff0000;
    }

.mode-select {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

.mode-btn {
      background: linear-gradient(135deg, var(--blood), #4a0000);
      color: var(--bone);
      border: 2px solid #ff0000;
      padding: 1rem 2rem;
      font-family: 'Nosifer', cursive;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(139, 0, 0, 0.8);
      transition: all 0.2s;
    }

.mode-btn:hover {
      background: #ff0000;
      box-shadow: 0 0 25px rgba(255, 0, 0, 1);
      transform: translateY(-3px);
    }

.container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      display: none;
    }

.container.show {
      display: block;
      animation: gameAppear 0.5s ease-out;
    }

    @keyframes gameAppear {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    h2 {
      font-family: 'Creepster', cursive;
      font-size: 2rem;
      color: var(--blood);
      text-align: center;
      margin-bottom: 0.25rem;
      text-shadow: 0 0 15px var(--blood);
    }

.game-mode {
      text-align: center;
      color: #ff4444;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
    }

.top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

.score-board {
      display: flex;
      gap: 0.5rem;
      flex: 1;
    }

.score {
      background: rgba(139, 0, 0, 0.2);
      padding: 0.4rem 0.8rem;
      border: 2px solid var(--blood);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(139, 0, 0, 0.5);
      font-size: 0.85rem;
      flex: 1;
      text-align: center;
    }

.score.active {
      border-color: #00ff00;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
    }

.quit-btn {
      background: #4a0000;
      color: var(--bone);
      border: 2px solid #ff0000;
      padding: 0.4rem 0.8rem;
      font-family: 'Nosifer', cursive;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(139, 0, 0, 0.6);
      transition: all 0.2s;
      white-space: nowrap;
    }

.quit-btn:hover {
      background: #ff0000;
      transform: scale(1.05);
    }

.status {
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      min-height: 1.2rem;
      color: #ff4444;
      text-shadow: 0 0 8px #ff0000;
    }

.board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0;
      border: 3px solid var(--blood);
      box-shadow: 0 0 20px rgba(139, 0, 0, 0.8), inset 0 0 30px rgba(0, 0, 0, 0.8);
      background: #000;
      margin: 0 auto;
      width: fit-content;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

.square {
      width: min(11vw, 60px);
      height: min(11vw, 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

.light { background: #1a1a1a; }
.dark {
      background: #0d0d0d;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(139,0,0,0.08) 4px, rgba(139,0,0,0.08) 8px);
    }

.dark.valid-move {
      box-shadow: inset 0 0 15px rgba(0, 255, 0, 0.4);
      cursor: pointer;
    }

.dark.valid-move::after {
      content: '';
      position: absolute;
      width: 25%;
      height: 25%;
      border-radius: 50%;
      background: rgba(0, 255, 0, 0.5);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }

.piece {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease-out;
    }

.piece.spawn {
      animation: spawn 0.3s ease-out;
    }

    @keyframes spawn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

.piece:hover {
      transform: scale(1.1);
      filter: brightness(1.2);
    }

.piece.selected {
      box-shadow: 0 0 15px #fff, 0 0 25px var(--blood);
    }

.player1 {
      background: radial-gradient(circle at 30% 30%, #c41e3a, var(--blood), #4a0000);
      border: 2px solid #ff0000;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.7), inset 0 0 8px rgba(0, 0, 0, 0.5);
    }

.player2 {
      background: radial-gradient(circle at 30% 30%, #4a4a4a, #1a1a1a, #000);
      border: 2px solid #666;
      box-shadow: 0 0 10px rgba(100, 100, 100, 0.5), inset 0 0 8px rgba(0, 0, 0, 0.8);
    }

.king::before {
      content: '♔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      color: #ffd700;
      text-shadow: 0 0 8px #ffd700;
    }

.piece.captured {
      animation: captured 0.3s ease-out forwards;
      pointer-events: none;
    }

    @keyframes captured {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }

.controls {
      margin-top: 1rem;
      text-align: center;
    }

    button {
      background: var(--blood);
      color: var(--bone);
      border: 2px solid #ff0000;
      padding: 0.6rem 1.2rem;
      font-family: 'Nosifer', cursive;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(139, 0, 0, 0.8);
      transition: all 0.2s;
    }

    button:hover {
      background: #ff0000;
      box-shadow: 0 0 20px rgba(255, 0, 0, 1);
      transform: scale(1.05);
    }

.game-over {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(0, 0, 0, 0.98);
      border: 3px solid var(--blood);
      padding: 2rem;
      text-align: center;
      z-index: 100;
      display: none;
      box-shadow: 0 0 40px rgba(255, 0, 0, 1);
      border-radius: 8px;
      min-width: 300px;
    }

.game-over.show {
      display: block;
      animation: winAppear 0.5s ease-out forwards;
    }

    @keyframes winAppear {
      to { transform: translate(-50%, -50%) scale(1); }
    }

.game-over h2 {
      font-family: 'Creepster', cursive;
      font-size: 2.5rem;
      color: var(--blood);
      margin-bottom: 1rem;
      text-shadow: 0 0 15px #ff0000;
      animation: winGlow 1s infinite alternate;
    }

    @keyframes winGlow {
      from { text-shadow: 0 0 15px #ff0000; }
      to { text-shadow: 0 0 30px #ff0000, 0 0 40px #ff0000; }
    }

.game-over.final-score {
      font-size: 1.2rem;
      color: var(--bone);
      margin-bottom: 1.5rem;
    }

.game-over button {
      margin: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="intro" id="intro">
    <h1>CURSED CHECKERS</h1>
    <p>Two souls enter. One leaves. Choose how you wish to bleed.</p>
    <div class="mode-select">
      <button class="mode-btn" onclick="startGame('computer')">VS THE VOID</button>
      <button class="mode-btn" onclick="startGame('human')">PASS & PLAY</button>
    </div>
  </div>

  <div class="container" id="gameContainer">
    <h2>CURSED CHECKERS</h2>
    <div class="game-mode" id="gameMode">Mode: Vs Computer</div>
    <div class="top-bar">
      <div class="score-board">
        <div class="score" id="p1Score">Blood: <span>12</span></div>
        <div class="score" id="p2Score">Void: <span>12</span></div>
      </div>
      <button class="quit-btn" onclick="backToMenu()">QUIT</button>
    </div>
    <div class="status" id="status">Your move. Spill blood.</div>
    <div class="board" id="board"></div>
    <div class="controls">
      <button onclick="restartGame()">Restart Ritual</button>
    </div>
  </div>

  <div class="game-over" id="gameOver">
    <h2 id="gameOverText"></h2>
    <div class="final-score" id="finalScore"></div>
    <button onclick="restartGame()">Face Them Again</button>
    <button onclick="backToMenu()">Back to Menu</button>
  </div>

  <script>
    const BOARD_SIZE = 8;
    let board = [];
    let selectedPiece = null;
    let currentPlayer = 'player1';
    let gameMode = 'computer';
    let audioCtx;
    let gameEnded = false;
    let aiThinking = false;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'move') {
        osc.frequency.value = 100;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } else if (type === 'capture') {
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'win') {
        [523, 659, 784, 1047].forEach((freq, i) => {
          setTimeout(() => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.15, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            o.start(); o.stop(audioCtx.currentTime + 0.3);
          }, i * 120);
        });
      } else if (type === 'lose') {
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.8);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      }
    }

    function startGame(mode) {
      gameMode = mode;
      document.getElementById('intro').classList.add('hide');
      setTimeout(() => {
        document.getElementById('gameContainer').classList.add('show');
        initGame();
      }, 500);
    }

    function backToMenu() {
      document.getElementById('gameContainer').classList.remove('show');
      document.getElementById('intro').classList.remove('hide');
      document.getElementById('gameOver').classList.remove('show');
      gameEnded = false;
      aiThinking = false;
    }

    function restartGame() {
      initGame();
    }

    function initGame() {
      board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));

      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          if ((row + col) % 2 === 1) {
            board[row][col] = { player: 'player2', king: false };
          }
        }
      }

      for (let row = 5; row < 8; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          if ((row + col) % 2 === 1) {
            board[row][col] = { player: 'player1', king: false };
          }
        }
      }

      selectedPiece = null;
      currentPlayer = 'player1';
      aiThinking = false;
      gameEnded = false;
      document.getElementById('gameOver').classList.remove('show');

      const modeText = gameMode === 'computer'? 'Mode: Vs The Void' : 'Mode: Pass & Play';
      document.getElementById('gameMode').textContent = modeText;
      document.getElementById('p1Score').innerHTML = gameMode === 'computer'? 'You: <span>12</span>' : 'Blood: <span>12</span>';
      document.getElementById('p2Score').innerHTML = gameMode === 'computer'? 'Void: <span>12</span>' : 'Shadow: <span>12</span>';

      updateStatus(gameMode === 'computer'? 'Your move. Spill blood.' : 'Blood moves first.');
      renderBoard();
      updateScores();
      updateActivePlayer();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          const square = document.createElement('div');
          square.className = `square ${(row + col) % 2 === 0? 'light' : 'dark'}`;
          square.dataset.row = row;
          square.dataset.col = col;

          if (board[row][col]) {
            const piece = document.createElement('div');
            piece.className = `piece ${board[row][col].player} spawn`;
            if (board[row][col].king) piece.classList.add('king');
            if (selectedPiece && selectedPiece.row === row && selectedPiece.col === col) {
              piece.classList.add('selected');
            }
            square.appendChild(piece);
          }

          square.addEventListener('click', () => handleSquareClick(row, col));
          boardEl.appendChild(square);
        }
      }

      if (selectedPiece) highlightValidMoves(selectedPiece.row, selectedPiece.col);
    }

    function handleSquareClick(row, col) {
      if (gameEnded || aiThinking) return;
      if (gameMode === 'computer' && currentPlayer === 'player2') return;

      const piece = board[row][col];
      const forcedCaptures = hasCapturesAvailable(currentPlayer);

      if (piece && piece.player === currentPlayer) {
        if (forcedCaptures) {
          const captures = getValidMoves(row, col, true);
          if (captures.length === 0) {
            updateStatus('That soul cannot strike. Choose one that can.');
            shakeBoard();
            return;
          }
        }
        selectedPiece = { row, col };
        renderBoard();
        return;
      }

      if (selectedPiece) {
        const validMoves = getValidMoves(selectedPiece.row, selectedPiece.col);
        const move = validMoves.find(m => m.row === row && m.col === col);

        if (move) {
          if (forcedCaptures &&!move.capture) {
            updateStatus('You must take the soul! Forced capture.');
            shakeBoard();
            return;
          }
          makeMove(selectedPiece.row, selectedPiece.col, move);
        } else {
          const canStillCapture = getValidMoves(selectedPiece.row, selectedPiece.col, true).length > 0;
          if (!canStillCapture) {
            selectedPiece = null;
            renderBoard();
          }
        }
      }
    }

    function getValidMoves(row, col, checkCapturesOnly = false) {
      const piece = board[row][col];
      if (!piece) return [];

      const moves = [];
      const captures = [];
      const directions = piece.king? [[-1,-1],[-1,1],[1,-1],[1,1]] :
                        piece.player === 'player1'? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];

      for (let [dr, dc] of directions) {
        const newRow = row + dr;
        const newCol = col + dc;

        if (isInBounds(newRow, newCol)) {
          if (!board[newRow][newCol] &&!checkCapturesOnly) {
            moves.push({ row: newRow, col: newCol, capture: null });
          } else if (board[newRow][newCol] && board[newRow][newCol].player!== piece.player) {
            const jumpRow = newRow + dr;
            const jumpCol = newCol + dc;
            if (isInBounds(jumpRow, jumpCol) &&!board[jumpRow][jumpCol]) {
              captures.push({ row: jumpRow, col: jumpCol, capture: { row: newRow, col: newCol } });
            }
          }
        }
      }

      return captures.length > 0? captures : (checkCapturesOnly? [] : moves);
    }

    function getAllValidMoves(player) {
      const allMoves = [];
      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          if (board[row][col] && board[row][col].player === player) {
            const moves = getValidMoves(row, col);
            moves.forEach(move => allMoves.push({ from: {row, col}, to: move }));
          }
        }
      }
      return allMoves;
    }

    function hasCapturesAvailable(player) {
      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          if (board[row][col] && board[row][col].player === player) {
            if (getValidMoves(row, col, true).length > 0) return true;
          }
        }
      }
      return false;
    }

    function makeMove(fromRow, fromCol, move) {
      if (gameEnded) return;

      const piece = board[fromRow][fromCol];
      if (!piece) return;

      board[fromRow][fromCol] = null;

      if (move.capture) {
        board[move.capture.row][move.capture.col] = null;
        playSound('capture');
      } else {
        playSound('move');
      }

      board[move.row][move.col] = piece;

      if ((piece.player === 'player1' && move.row === 0) || (piece.player === 'player2' && move.row === 7)) {
        piece.king = true;
      }

      renderBoard();
      updateScores();

      const additionalCaptures = move.capture? getValidMoves(move.row, move.col, true) : [];

      if (move.capture && additionalCaptures.length > 0) {
        selectedPiece = { row: move.row, col: move.col };
        updateStatus('Another soul bleeds. Strike again!');
        renderBoard();
      } else {
        selectedPiece = null;
        currentPlayer = currentPlayer === 'player1'? 'player2' : 'player1';

        if (checkGameOver()) return;

        updateActivePlayer();

        if (gameMode === 'computer' && currentPlayer === 'player2') {
          updateStatus('The void stirs...');
          aiThinking = true;
          setTimeout(() => {
            computerMove();
            aiThinking = false;
          }, 500);
        } else {
          const nextPlayer = gameMode === 'computer'? 'Your move. Spill blood.' :
                            currentPlayer === 'player1'? 'Blood turn.' : 'Shadow turn.';
          updateStatus(nextPlayer);
        }
      }
    }

    function computerMove() {
      if (gameEnded || currentPlayer!== 'player2') return;

      const allMoves = getAllValidMoves('player2');
      const captures = allMoves.filter(m => m.to.capture);
      const movesToUse = captures.length > 0? captures : allMoves;

      if (movesToUse.length === 0) {
        checkGameOver();
        return;
      }

      movesToUse.sort((a, b) => {
        if (a.to.capture &&!b.to.capture) return -1;
        if (!a.to.capture && b.to.capture) return 1;
        return b.to.row - a.to.row;
      });

      const move = movesToUse[0];
      makeMove(move.from.row, move.from.col, move.to);
    }

    function checkGameOver() {
      const { p1Count, p2Count } = getPieceCounts();

      if (p1Count === 0) {
        endGame('player2');
        return true;
      }
      if (p2Count === 0) {
        endGame('player1');
        return true;
      }

      const currentMoves = getAllValidMoves(currentPlayer);
      if (currentMoves.length === 0) {
        endGame(currentPlayer === 'player1'? 'player2' : 'player1');
        return true;
      }

      return false;
    }

    function getPieceCounts() {
      let p1Count = 0, p2Count = 0;
      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          if (board[row][col]) {
            if (board[row][col].player === 'player1') p1Count++;
            else p2Count++;
          }
        }
      }
      return { p1Count, p2Count };
    }

    function endGame(winner) {
      if (gameEnded) return;
      gameEnded = true;
      aiThinking = false;

      const gameOverEl = document.getElementById('gameOver');
      const textEl = document.getElementById('gameOverText');
      const scoreEl = document.getElementById('finalScore');
      const { p1Count, p2Count } = getPieceCounts();

      if (gameMode === 'computer') {
        if (winner === 'player1') {
          textEl.textContent = 'YOU DEVOURED THE VOID';
          scoreEl.textContent = `Final Souls: You ${p1Count} - Void ${p2Count}`;
          playSound('win');
        } else {
          textEl.textContent = 'THE VOID CONSUMES YOU';
          scoreEl.textContent = `Final Souls: You ${p1Count} - Void ${p2Count}`;
          playSound('lose');
        }
      } else {
        textEl.textContent = winner === 'player1'? 'BLOOD SOULS TRIUMPH' : 'SHADOW SOULS TRIUMPH';
        scoreEl.textContent = `Final Souls: Blood ${p1Count} - Shadow ${p2Count}`;
        playSound('win');
      }

      gameOverEl.classList.add('show');
    }

    function updateStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function updateActivePlayer() {
      document.getElementById('p1Score').classList.toggle('active', currentPlayer === 'player1');
      document.getElementById('p2Score').classList.toggle('active', currentPlayer === 'player2');
    }

    function updateScores() {
      const { p1Count, p2Count } = getPieceCounts();
      document.querySelector('#p1Score span').textContent = p1Count;
      document.querySelector('#p2Score span').textContent = p2Count;
    }

    function highlightValidMoves(row, col) {
      const moves = getValidMoves(row, col);
      const captures = moves.filter(m => m.capture);
      const toHighlight = captures.length > 0? captures : moves;

      toHighlight.forEach(move => {
        const square = document.querySelector(`[data-row="${move.row}"][data-col="${move.col}"]`);
        if (square) square.classList.add('valid-move');
      });
    }

    function shakeBoard() {
      const boardEl = document.getElementById('board');
      boardEl.style.animation = 'shake 0.3s';
      setTimeout(() => boardEl.style.animation = '', 300);
    }

    function isInBounds(row, col) {
      return row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE;
    }
  </script>
</body>
</html>
